server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # resolver+变量：容器重建换 IP 后按 TTL 重解析（否则 backend 重启后一直 502）。
        # DNS 地址运行时从容器 resolv.conf 自发现（docker=127.0.0.11 / podman=网关），
        # 由 Dockerfile 入口脚本注入 ${DNS_RESOLVER}，不写死任何环境的地址
        resolver ${DNS_RESOLVER} valid=10s ipv6=off;
        set $backend_upstream http://backend:8810;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;          # SSE 流式（智能体对话）不能缓冲
    }

    # WebSocket（WebShell / 实时事件）
    location /ws/ {
        resolver ${DNS_RESOLVER} valid=10s ipv6=off;
        set $backend_ws http://backend:8810;
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
