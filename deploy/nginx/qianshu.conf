# 千枢 · 源码部署生产模式 nginx 站点（install.sh --mode source 落位到
# /etc/nginx/conf.d/qianshu.conf 并 nginx -t 后 reload）
# 前端静态 = frontend/dist；/api/ 反代后端 8810。
server {
    listen 80;
    server_name _;

    root /opt/qianshu/frontend/dist;
    index index.html;

    # 后端 API 反代（127.0.0.1:8810，同机 systemd qianshu-backend）
    location /api/ {
        proxy_pass http://127.0.0.1:8810;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;          # SSE 流式（智能体对话）不能缓冲
    }

    # WebSocket（WebShell / 实时事件）
    location /ws/ {
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
